[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nanogpt-macbook"
version = "0.1.0"
description = "Train a small GPT on your MacBook with MLX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mlx==0.32.3; sys_platform == 'darwin'",
  "mlx[cpu]==0.32.3; sys_platform == 'linux'",
  "numpy>=2.2,<3",
]

[project.scripts]
nanogpt = "nanogpt_macbook.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
